[package]
name = "varnish-tracer"
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
libc = "0.2.191"
prost = { version = "0.14.4", default-features = false, features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
ureq = "3.5.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
