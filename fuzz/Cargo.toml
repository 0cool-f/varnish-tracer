[package]
name = "varnish-tracer-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
prost = { version = "0.14.4", default-features = false, features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[workspace]

[profile.release]
debug = 1

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_structured"
path = "fuzz_targets/parse_structured.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_line"
path = "fuzz_targets/read_line.rs"
test = false
doc = false
bench = false
